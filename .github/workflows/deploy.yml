name: Deploy to AWS (S3 + CloudFront)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # GitHub OIDC -> AWS IAM role (no long-lived access keys)
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
      NEXT_PUBLIC_FORM_ENDPOINT: ${{ vars.FORM_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build # -> out/

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Content-hashed JS/CSS: cache for a year.
      - name: Upload static assets
        run: >
          aws s3 sync out/ "s3://${{ vars.S3_BUCKET }}" --delete
          --exclude "*" --include "_next/static/*"
          --cache-control "public,max-age=31536000,immutable"

      # HTML and everything else: always revalidate so updates appear immediately.
      - name: Upload pages
        run: >
          aws s3 sync out/ "s3://${{ vars.S3_BUCKET }}" --delete
          --exclude "_next/static/*"
          --cache-control "public,max-age=0,must-revalidate"

      - name: Invalidate CloudFront
        run: >
          aws cloudfront create-invalidation
          --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}"
          --paths "/*"
